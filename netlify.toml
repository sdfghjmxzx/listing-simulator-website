[build]
  publish = "."

# Do not set Content-Disposition on /downloads/* — it applies to 404s too and
# makes Chrome show ERR_INVALID_RESPONSE when a file is missing.

[[headers]]
  for = "/updates/*.yml"
  [headers.values]
    Content-Type = "text/yaml; charset=utf-8"
    Cache-Control = "no-cache"

[[headers]]
  for = "/updates/*.exe"
  [headers.values]
    Content-Type = "application/octet-stream"
    Content-Disposition = "attachment"

[[headers]]
  for = "/updates/*.blockmap"
  [headers.values]
    Content-Type = "application/octet-stream"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
